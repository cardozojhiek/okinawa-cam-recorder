name: Gravar câmeras de Okinawa

# Robô gravador da box Okinawa's Cam (WebApp JK).
# Grava trechos curtos das lives públicas, em CORTES DE 5 MINUTOS,
# sobe pro Google Drive do dono (pasta OkinawaCams) e atualiza o
# recordings.json que o app lê. Custo zero: roda nos minutos gratuitos
# do GitHub Actions e no espaço gratuito do Drive.
#
# Teto por câmera: ~500 MB no Drive. Quando uma câmera passa do teto,
# os cortes mais antigos DELA são apagados (vai sobrepondo), sem mexer
# nas outras câmeras.
#
# Agenda (UTC; JST = UTC+9):
#   33 8 * * *  → 17:33 JST, Fusaki Beach, 15 min (pôr do sol)
#   0 4 * * *   → 13:00 JST, Baía de Kabira, 10 min (mar do meio-dia)
# Manual: aba Actions → "Gravar câmeras de Okinawa" → Run workflow
# (escolhe a câmera e os minutos).
#
# Segredo necessário (Settings → Secrets and variables → Actions):
#   RCLONE_CONF_B64 — a configuração do rclone (Google Drive do dono)
#   codificada em base64. Sem ele, a etapa do Drive falha e nada grava.

on:
  workflow_dispatch:
    inputs:
      cam:
        description: "Câmera"
        type: choice
        options: [fusaki, kabira, kumejima]
        default: fusaki
      minutes:
        description: "Minutos de gravação (1-60)"
        type: number
        default: 3
  schedule:
    - cron: "33 8 * * *"
    - cron: "0 4 * * *"

permissions:
  contents: write

concurrency:
  group: okinawa-cam-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Definir câmera e duração
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cam=${{ inputs.cam }}" >> "$GITHUB_OUTPUT"
            echo "minutes=${{ inputs.minutes }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            echo "cam=kabira" >> "$GITHUB_OUTPUT"
            echo "minutes=10" >> "$GITHUB_OUTPUT"
          else
            echo "cam=fusaki" >> "$GITHUB_OUTPUT"
            echo "minutes=15" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar ferramentas
        run: |
          pip install -q yt-dlp streamlink
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp
          sudo cp /tmp/rclone-*/rclone /usr/local/bin/
          which ffmpeg && ffmpeg -version | head -1
          yt-dlp --version

      - name: Configurar o Google Drive
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
        run: |
          if [ -z "$RCLONE_CONF_B64" ]; then
            echo "::error::O segredo RCLONE_CONF_B64 ainda não foi configurado — a conexão com o Drive está pendente."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Resolver a live e gravar em cortes de 5 min
        id: rec
        env:
          CAM: ${{ steps.cfg.outputs.cam }}
          MINUTES: ${{ steps.cfg.outputs.minutes }}
        run: |
          case "$CAM" in
            fusaki)   PAGE="https://www.youtube.com/@yaeyamalive/live"; NAME="Fusaki Beach" ;;
            kabira)   PAGE="https://www.youtube.com/@ishigaki-ch/live"; NAME="Baía de Kabira" ;;
            kumejima) PAGE="https://www.youtube.com/channel/UCuyA_qFHnmPvl-PJUwO9hlA/live"; NAME="Kumejima · Kumi no Sato" ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # 1ª tentativa de endereço: a própria API do app (descobre o vídeo da live).
          TARGETS=()
          RESP=$(curl -s --max-time 20 "https://webapp-jk.pages.dev/api/cam?c=${CAM}") || RESP=""
          VID=$(echo "$RESP" | python3 -c "import sys, json
          try:
              d = json.load(sys.stdin)
              print(d.get('videoId') or '' if d.get('live') else '')
          except Exception:
              print('')" 2>/dev/null) || VID=""
          if [ -n "$VID" ]; then
            echo "API do app: live em https://www.youtube.com/watch?v=$VID"
            TARGETS+=("https://www.youtube.com/watch?v=$VID")
          else
            echo "API do app não confirmou live agora: $RESP"
          fi
          TARGETS+=("$PAGE")
          # Extração do endereço do stream. O streamlink vai primeiro:
          # no teste de 12/nov ele resolveu a live a partir do servidor
          # do GitHub, enquanto o yt-dlp tomou o bloqueio "confirme que
          # você não é um robô" em todos os clientes. yt-dlp é a reserva.
          HLS=""
          for target in "${TARGETS[@]}"; do
            echo "Tentando streamlink: $target"
            HLS=$(streamlink --stream-url "$target" best 2>/tmp/slink.err | head -1) || HLS=""
            if [ -n "$HLS" ]; then break; fi
            tail -2 /tmp/slink.err || true
            for client in default web_safari mweb tv_embedded ios android; do
              if [ "$client" = "default" ]; then ARGS=(); else ARGS=(--extractor-args "youtube:player_client=$client"); fi
              echo "Tentando yt-dlp: $target (cliente $client)"
              HLS=$(yt-dlp -g --no-warnings -f "95/94/93/best" "${ARGS[@]}" "$target" 2>/tmp/ytdlp.err | head -1) || HLS=""
              if [ -n "$HLS" ]; then break 2; fi
              tail -2 /tmp/ytdlp.err || true
            done
          done
          if [ -z "$HLS" ]; then
            echo "::warning::Não consegui o endereço da live de $CAM (YouTube bloqueou o servidor ou a live caiu). Nada foi gravado nesta rodada."
            echo "gravou=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Stream resolvido. Gravando $MINUTES min em cortes de 5 min..."
          STAMP=$(TZ=Asia/Tokyo date +%Y%m%d-%H%M)
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          mkdir -p parts
          ffmpeg -hide_banner -loglevel warning -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 \
            -t $(( MINUTES * 60 )) -i "$HLS" -c copy \
            -f segment -segment_time 300 -segment_start_number 1 -reset_timestamps 1 \
            "parts/${CAM}-${STAMP}-p%02d.mp4" || true
          ls -la parts/ || true
          if ls parts/*.mp4 >/dev/null 2>&1; then
            echo "gravou=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::A gravação não gerou nenhum corte utilizável."
            echo "gravou=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar pro Drive e aplicar o teto de 500 MB da câmera
        id: up
        if: steps.rec.outputs.gravou == 'true'
        env:
          CAM: ${{ steps.cfg.outputs.cam }}
        run: |
          : > clips.tsv
          for f in parts/*.mp4; do
            base=$(basename "$f")
            rclone copyto "$f" "gdrive:OkinawaCams/$base"
            LINK=$(rclone link "gdrive:OkinawaCams/$base")
            echo "Link público de $base: $LINK"
            ID=$(echo "$LINK" | sed -E 's/.*(id=|\/d\/)([A-Za-z0-9_-]+).*/\2/')
            if [ -z "$ID" ] || [ "$ID" = "$LINK" ]; then echo "::error::Não consegui extrair o ID de $base no Drive."; exit 1; fi
            printf '%s\t%s\n' "$base" "$ID" >> clips.tsv
          done
          cat clips.tsv
          # Teto de ~500 MB POR CÂMERA: soma só os arquivos desta câmera,
          # do mais novo pro mais antigo; o que passar do teto é apagado.
          # Arquivos gravados nesta rodada nunca são apagados.
          rclone lsf "gdrive:OkinawaCams" --files-only --format "s;p" > all.txt
          python3 - <<'PY'
          import os
          cam = os.environ["CAM"]
          cap = 500 * 1024 * 1024
          novos = set()
          try:
              with open("clips.tsv", encoding="utf-8") as fh:
                  for linha in fh:
                      partes = linha.rstrip("\n").split("\t")
                      if partes and partes[0]:
                          novos.add(partes[0])
          except FileNotFoundError:
              pass
          itens = []
          with open("all.txt", encoding="utf-8") as fh:
              for linha in fh:
                  linha = linha.strip()
                  if not linha:
                      continue
                  size, _, path = linha.partition(";")
                  if path.startswith(cam + "-"):
                      itens.append((path, int(size)))
          itens.sort(key=lambda x: x[0], reverse=True)
          total = 0
          apagar = []
          for path, size in itens:
              total += size
              if total > cap and path not in novos:
                  apagar.append(path)
          with open("deleted.txt", "w", encoding="utf-8") as fh:
              for path in apagar:
                  fh.write(path + "\n")
          print(f"{cam}: {len(itens)} arquivo(s), total {total/1048576:.1f} MB, teto 500 MB, apagando {len(apagar)} antigo(s).")
          PY
          while read -r old; do
            [ -n "$old" ] && echo "Apagando antigo: $old" && rclone deletefile "gdrive:OkinawaCams/$old"
          done < deleted.txt

      - name: Atualizar o manifesto das gravações
        if: steps.rec.outputs.gravou == 'true'
        env:
          CAM: ${{ steps.cfg.outputs.cam }}
          NAME: ${{ steps.rec.outputs.name }}
          STAMP: ${{ steps.rec.outputs.stamp }}
          MINUTES: ${{ steps.cfg.outputs.minutes }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          stamp = os.environ["STAMP"]  # YYYYMMDD-HHMM (JST)
          data = f"{stamp[0:4]}-{stamp[4:6]}-{stamp[6:8]}"
          base = datetime.datetime.strptime(stamp, "%Y%m%d-%H%M")
          total_min = int(os.environ["MINUTES"])
          apagados = set()
          try:
              with open("deleted.txt", encoding="utf-8") as fh:
                  apagados = {l.strip() for l in fh if l.strip()}
          except FileNotFoundError:
              pass
          novos = []
          with open("clips.tsv", encoding="utf-8") as fh:
              for i, linha in enumerate(fh):
                  partes = linha.rstrip("\n").split("\t")
                  if len(partes) < 2:
                      continue
                  inicio = base + datetime.timedelta(minutes=5 * i)
                  novos.append({
                      "cam": os.environ["CAM"],
                      "name": os.environ["NAME"],
                      "date": inicio.strftime("%Y-%m-%d"),
                      "time": inicio.strftime("%H:%M"),
                      "minutes": max(1, min(5, total_min - 5 * i)),
                      "driveId": partes[1],
                      "file": partes[0],
                  })
          path = "recordings.json"
          try:
              with open(path, encoding="utf-8") as fh:
                  dados = json.load(fh)
          except Exception:
              dados = {"recordings": []}
          recs = [r for r in dados.get("recordings", []) if r.get("file") not in apagados]
          recs.extend(novos)
          recs.sort(key=lambda r: (r.get("date", ""), r.get("time", "")), reverse=True)
          dados["recordings"] = recs[:60]
          dados["updatedAt"] = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).isoformat()
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(dados, fh, ensure_ascii=False, indent=2)
          print(f"Manifesto: {len(dados['recordings'])} gravação(ões); novas: {len(novos)}; removidas pelo teto: {len(apagados)}")
          PY
          git config user.name "okinawa-cam-recorder"
          git config user.email "actions@github.com"
          git add recordings.json
          git commit -m "Gravação: ${NAME} (${STAMP})"
          git push
